<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
  </defs>

  <!-- Símbolo Oficial Boi & Brasa (Engrenagem com Cabeça de Boi) -->
  <g transform="translate(15, 10)">
    <!-- Fundo Circular Vermelho / Carvão -->
    <circle cx="50" cy="50" r="46" fill="#1C1917" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="50" cy="50" r="42" fill="url(#fireGrad)" opacity="0.3" />

    <!-- Engrenagem externa estilizada -->
    <path d="M 50 12 L 53 19 L 61 17 L 62 25 L 70 26 L 68 34 L 75 38 L 70 45 L 75 51 L 68 56 L 71 64 L 63 66 L 62 74 L 54 73 L 50 80 L 46 73 L 38 74 L 37 66 L 29 64 L 32 56 L 25 51 L 30 45 L 25 38 L 32 34 L 30 26 L 38 25 L 39 17 L 47 19 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Cabeça de Boi / Touro estilizada -->
    <path d="M 40 33 C 37 25, 33 24, 30 25 C 33 30, 37 34, 40 37
             C 38 41, 37 47, 39 52 C 40 57, 44 61, 48 64 
             C 52 65, 56 64, 59 62 C 63 58, 64 52, 63 46 
             C 66 44, 69 40, 71 35 C 67 34, 64 36, 62 39
             C 59 36, 54 34, 49 34 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Olho do Touro -->
    <circle cx="47" cy="45" r="2" fill="url(#goldGrad)" />
    <!-- Chifre Esquerdo -->
    <path d="M 40 34 C 36 28, 30 25, 27 27 C 29 32, 34 35, 38 37" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
    <!-- Chifre Direito -->
    <path d="M 60 35 C 64 29, 70 26, 73 28 C 71 33, 66 36, 62 38" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
  </g>

  <!-- Tipografia Oficial do Nome -->
  <text x="125" y="54" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="34" font-weight="900" fill="#F5F5F4" letter-spacing="3">
    FRIGORÍFICO <tspan fill="url(#goldGrad)">MF</tspan>
  </text>
  
  <!-- Linha divisória dourada com ornamento -->
  <line x1="125" y1="67" x2="490" y2="67" stroke="url(#goldGrad)" stroke-width="1.8" />
  <circle cx="307" cy="67" r="3.5" fill="url(#goldGrad)" />
  
  <!-- Subtítulo / Marca Boi & Brasa -->
  <text x="125" y="88" font-family="'Cinzel', 'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="url(#goldGrad)" letter-spacing="6">
    BOI &amp; BRASA
  </text>
  <text x="260" y="88" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#A8A29E" letter-spacing="2">
    &bull; ASSADOS &bull; NO BAFO &bull; QUENTINHAS
  </text>
</svg>
